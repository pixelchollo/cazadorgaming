<!DOCTYPE html>
<html lang="es">
<head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6788146281468184"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelChollo | Juegos Gratis y Ofertas Gaming en Tiempo Real</title>
  
  <!-- CÓDIGO DE GOOGLE ADSENSE (Descomenta y pega tu ID cuando te lo den) -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background: linear-gradient(180deg, #1e293b 0%, #0b0f19 100%);
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }
    header h1 { color: var(--accent); font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
    header p { color: var(--text-muted); font-size: 1rem; }

    /* Filtros por plataforma */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .ad-banner {
      background-color: var(--card-bg);
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
      text-align: center;
      padding: 15px;
      margin: 15px auto;
      max-width: 1200px;
      width: 90%;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; flex-grow: 1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-content { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.1rem; margin-bottom: 8px; color: var(--text-main); line-height: 1.3; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .badge { display: inline-block; background-color: #1e293b; color: #38bdf8; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; margin-bottom: 10px; width: fit-content; font-weight: 600; }
    .btn { display: block; text-align: center; background-color: var(--accent); color: #fff; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: auto; transition: background 0.2s; }
    .btn:hover { background-color: var(--accent-hover); }

    footer {
      background-color: #070a12;
      border-top: 1px solid var(--border-color);
      padding: 20px;
      text-align: center;
      margin-top: 40px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    footer a { color: var(--accent); text-decoration: none; margin: 0 10px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>🎮 PixelChollo</h1>
    <p>Chollos, claves y juegos gratis actualizados automáticamente cada minuto</p>
  </header>

  <div class="ad-banner">
    [ Espacio reservado para Anuncio Google AdSense ]
  </div>

  <main class="container">
    <!-- Filtros de navegación -->
    <div class="filter-container">
      <button class="filter-btn active" onclick="filterGames('all')">Todos</button>
      <button class="filter-btn" onclick="filterGames('pc')">PC</button>
      <button class="filter-btn" onclick="filterGames('steam')">Steam</button>
      <button class="filter-btn" onclick="filterGames('epic-games-store')">Epic Games</button>
    </div>

    <div id="loading" style="text-align: center; color: var(--text-muted); margin: 40px 0;">Cargando chollos en tiempo real...</div>
    <div class="grid" id="games-grid"></div>
  </main>

  <footer>
    <p>© PixelChollo - Todos los derechos reservados</p>
    <p style="margin-top: 8px;">
      <a href="privacidad.html">Política de Privacidad y Cookies</a> | 
      <a href="index.html">Inicio</a>
    </p>
  </footer>

  <script>
    let allGiveaways = [];

    // Cargar ofertas desde GamerPower API
    fetch('https://www.gamerpower.com/api/giveaways')
      .then(res => res.json())
      .then(data => {
        allGiveaways = data;
        document.getElementById('loading').style.display = 'none';
        renderGames(allGiveaways.slice(0, 15));
      })
      .catch(err => {
        document.getElementById('loading').innerText = 'Error al cargar las ofertas.';
      });

    function renderGames(games) {
      const grid = document.getElementById('games-grid');
      grid.innerHTML = '';
      games.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${game.image}" alt="${game.title}">
          <div class="card-content">
            <span class="badge">${game.platforms}</span>
            <h2 class="card-title">${game.title}</h2>
            <p class="card-desc">${game.instructions || game.description}</p>
            <a href="${game.open_giveaway_url}" target="_blank" rel="noopener noreferrer" class="btn">Reclamar Gratis</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames(platform) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (platform === 'all') {
        renderGames(allGiveaways.slice(0, 15));
      } else {
        const filtered = allGiveaways.filter(g => g.platforms.toLowerCase().includes(platform));
        renderGames(filtered.slice(0, 15));
      }
    }
  </script>
</body>
</html>
