<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelChollo | Juegos Gratis y Ofertas Gaming en Tiempo Real</title>

  <!-- 1. CÓDIGO DE GOOGLE ADSENSE (Ubicado correctamente en el <head>) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6788146281468184" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 25px 20px;
      text-align: center;
    }
    header h1 { color: var(--accent); font-size: 2.2rem; margin-bottom: 5px; }
    header p { color: var(--text-muted); font-size: 1rem; }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .game-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #1e293b;
    }
    .game-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .game-info h3 { font-size: 1.1rem; margin-bottom: 8px; line-height: 1.3; }
    .game-info p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px; flex: 1; }
    
    .btn {
      display: block;
      background-color: var(--accent);
      color: #fff;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover { background-color: var(--accent-hover); }

    footer {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 40px;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>PixelChollo</h1>
    <p>Las mejores ofertas y juegos gratuitos para gamers en tiempo real</p>
  </header>

  <main>
    <div id="loading" class="loading">Cargando los mejores chollos gaming...</div>
    <div id="games-container" class="games-grid"></div>
  </main>

  <footer>
    <p>&copy; 2026 PixelChollo. Todos los derechos reservados. | <a href="privacidad.html">Política de Privacidad y Cookies</a></p>
  </footer>

  <!-- 2. SCRIPT DE CARGA AUTOMÁTICA DE JUEGOS (GamerPower) -->
  <script>
    async function fetchGames() {
      const container = document.getElementById('games-container');
      const loading = document.getElementById('loading');
      
      const proxies = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?'
      ];

      let data = null;

      for (let proxy of proxies) {
        try {
          const response = await fetch(proxy + encodeURIComponent('https://www.gamerpower.com/api/giveaways'));
          if (response.ok) {
            data = await response.json();
            break;
          }
        } catch (e) {
          console.log('Intentando proxy alternativo...');
        }
      }

      loading.style.display = 'none';

      if (data && Array.isArray(data) && data.length > 0) {
        data.slice(0, 20).forEach(game => {
          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <img src="${game.image}" alt="${game.title}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500&q=80'">
            <div class="game-info">
              <h3>${game.title}</h3>
              <p>${game.description ? game.description.substring(0, 90) : '¡Consigue este juego totalmente gratis por tiempo limitado!'}...</p>
              <a href="${game.open_giveaway_url}" target="_blank" rel="noopener noreferrer" class="btn">Obtener Gratis</a>
            </div>
          `;
          container.appendChild(card);
        });
      } else {
        container.innerHTML = '<div style="text-align: center; grid-column: 1/-1; padding: 30px; color: #94a3b8;">No se pudieron cargar las ofertas en este momento. Inténtalo de nuevo en unos minutos.</div>';
      }
    }

    fetchGames();
  </script>

</body>
</html>
